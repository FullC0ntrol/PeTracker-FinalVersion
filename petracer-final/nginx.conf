server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Pliki z hashem w nazwie (assets/) można trzymać w cache długo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routing SPA (createBrowserRouter): każdy nieznany adres -> index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
